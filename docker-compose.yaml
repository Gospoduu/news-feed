services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-news}:${POSTGRES_PASSWORD:-news_local_password}@postgres:5432/${POSTGRES_DB:-news}
      REDIS_URL: redis://redis:6379/0
      KAFKA_URL: news-kafka:19092
      NEWS_TOPIC: ${NEWS_TOPIC:-news.created}
      ANALYSIS_REQUEST_TOPIC: ${ANALYSIS_REQUEST_TOPIC:-insight.requested}
      ANALYSIS_RESPONSE_TOPIC: ${ANALYSIS_RESPONSE_TOPIC:-insight.completed}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,http://127.0.0.1:8081}
    ports:
      - "127.0.0.1:${NEWS_FEED_APP_PORT:-8002}:8000"
    networks:
      default: {}
      alfa-services:
        aliases:
          - news-feed-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-news}
      POSTGRES_USER: ${POSTGRES_USER:-news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-news_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:

networks:
  alfa-services:
    name: alfa-services
    external: true
